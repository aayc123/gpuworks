model_id: inclusionai/llada2.1-mini
source: upstream
display_title: Llada2.1 Mini
release_date: '2026-02-09'
model_config: {model_type: llada2_moe, num_hidden_layers: 20, hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 4, head_dim: 128, max_position_embeddings: 32768, sliding_window: 4096}
kv_bytes_per_token:
  vllm: 40960
  sglang: 40960
specs:
- name: bf16-sglang-nvidia-general
  display_name_zh_cn: Ampere 及以上 · BF16
  display_name_en: Ampere+ · BF16
  scenario: balanced
  engine: sglang
  image: gpuworks/gpuworks-runner:cuda13.0-sglang0.5.21-r2
  weights:
    quantization: bf16
    sources:
    - huggingface:
        repo_id: inclusionAI/LLaDA2.1-mini
        revision: 20e64e2ad21644d0e5248586ed9c942cdd45de0f
    - modelscope:
        repo_id: inclusionAI/LLaDA2.1-mini
        revision: 868c5f1d98c21b29e53fee5cb952116eecadff91
  weight_bytes: 32522219389
  gpus:
    vendor: nvidia
    cc: '>=8.0'
  env:
    # FlashInfer's DeepSeek fused-top-k kernel starts at compute capability 9.0.
    # A100 uses SGLang's bit-exact JIT router instead.
    SGLANG_OPT_USE_JIT_KERNEL_GROUPED_TOPK: '1'
  args:
  - --enable-metrics
  - --dllm-algorithm
  - JointThreshold
  - --trust-remote-code
  - --attention-backend
  - flashinfer
  # Decode CUDA graph stays on, capped at batch 8; prefill graph capture is
  # disabled because enabling it OOMs on this model (issue #35).
  # Verified on SGLang 0.5.21 (runner cuda13.0-sglang0.5.21-r2), 2x RTX 3090,
  # TP2, with the JIT grouped-top-k router above, 2026-11-19.
  #
  # Prefill graph: must stay disabled. With --cuda-graph-backend-prefill left
  # unset (default breakable backend), capture OOMs on the 17th of 50 token
  # buckets (num_tokens=704) inside graph.capture_end() with
  # "CUDA error: out of memory". At --mem-fraction-static=0.88 only ~2.27 GiB
  # remains per GPU after KV cache allocation (~1.84 GiB at capture begin).
  # The visible "num_active_captures_ > 0 INTERNAL ASSERT FAILED" is a secondary
  # assertion raised after the first capture_end() already failed; treat the
  # OOM as the root cause, not the assert. 2/2 reproductions on 2026-11-19.
  # Re-check after an SGLang/torch bump: launch once without
  # --cuda-graph-backend-prefill disabled.
  #
  # Decode graph: kept on to avoid the per-step launch overhead, but capped at
  # batch 8 (--cuda-graph-max-bs-decode=8) because uncapped capture is too
  # large on this model/GPU (issue #35). Do not re-add --disable-cuda-graph:
  # it is a global switch and would also turn off the decode graph, making the
  # two flags below no-ops. Re-check before raising the cap or enabling prefill
  # capture.
  - --cuda-graph-backend-prefill
  - disabled
  - --cuda-graph-max-bs-decode
  - '8'
  api:
    health_endpoint: /health
    operations:
    - type: openai.chat
      endpoint: /v1/chat/completions
      mode: stream
input_modalities: [text]
